<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LLM Trading Dataset Auditing — Architecture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }
        
         :root {
            --ink: #22384f;
            --muted: #6a7686;
            --arr: #3f83d6;
            --o: #ef913b;
            --g: #3f9e5a;
            --b: #3d7ec2;
            --p: #a24fc8;
        }
        
        html,
        body {
            height: 100%
        }
        
        body {
            background: linear-gradient(180deg, #e9eef4, #dce3ec);
            font-family: 'Poppins', sans-serif;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: var(--ink)
        }
        /* ---------- toolbar ---------- */
        
        #bar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 18px;
            background: #fff;
            border-bottom: 1px solid #dfe5ec;
            flex-wrap: wrap
        }
        
        .kick {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 9.5px;
            font-weight: 600;
            letter-spacing: .2em;
            color: var(--b)
        }
        
        .pill {
            display: flex;
            align-items: center;
            gap: 8px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .12em;
            color: var(--muted);
            border: 1px solid #d9e0e9;
            border-radius: 999px;
            padding: 8px 14px
        }
        
        .pill i {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #b8c2ce;
            transition: .3s
        }
        
        .pill.run i {
            background: var(--o);
            animation: blink 1s steps(2) infinite
        }
        
        .pill.done i {
            background: #2fa866
        }
        
        @keyframes blink {
            50% {
                opacity: .15
            }
        }
        
        .hintbar {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            color: #8b97a6
        }
        
        .spacer {
            flex: 1
        }
        
        .seg {
            display: flex;
            border: 1px solid #d9e0e9;
            border-radius: 8px;
            overflow: hidden
        }
        
        .seg button {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            padding: 8px 11px;
            background: none;
            border: 0;
            color: var(--muted);
            cursor: pointer
        }
        
        .seg button.on {
            background: #eaf2fb;
            color: var(--b)
        }
        
        .btn {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10.5px;
            font-weight: 600;
            letter-spacing: .14em;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #c9d4e0;
            background: #fff;
            color: var(--ink);
            cursor: pointer;
            transition: .15s
        }
        
        .btn:hover {
            border-color: var(--b);
            color: var(--b)
        }
        
        .btn.primary {
            background: var(--b);
            border-color: var(--b);
            color: #fff
        }
        
        .btn.primary:hover:not(:disabled) {
            background: #2f6fc2
        }
        
        .btn:disabled {
            opacity: .5;
            cursor: default
        }
        /* ---------- stage ---------- */
        
        #stage {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            overflow: auto;
            position: relative;
            min-height: 0
        }
        
        svg#cv {
            width: min(1410px, 100%);
            height: auto;
            min-width: 1080px;
            filter: drop-shadow(0 10px 28px rgba(40, 60, 90, .14))
        }
        
        #cv text {
            font-family: 'Poppins', sans-serif;
            user-select: none
        }
        
        #cv .mono {
            font-family: 'IBM Plex Mono', monospace
        }
        
        .ic {
            stroke-width: 1.9;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round
        }
        
        .ic path,
        .ic circle,
        .ic rect,
        .ic ellipse {
            stroke: currentColor
        }
        
        .ic .f {
            fill: currentColor;
            stroke: none
        }
        /* intro pops */
        
        .in {
            animation: popin .55s cubic-bezier(.2, .7, .25, 1) both
        }
        
        @keyframes popin {
            from {
                opacity: 0;
                transform: translateY(12px)
            }
        }
        
        .node .in {
            transition: transform .22s
        }
        
        .node:hover .in {
            transform: translateY(-3px)
        }
        
        .node {
            cursor: pointer
        }
        
        .node:hover .cbox {
            stroke-width: 2.1
        }
        
        .node.act .cbox {
            stroke: var(--arr)!important;
            stroke-width: 2.2;
            filter: drop-shadow(0 0 5px rgba(63, 131, 214, .55))
        }
        
        .cbox {
            transition: stroke .2s, stroke-width .2s
        }
        /* status dots */
        
        .pdot {
            animation: dpulse 2.4s ease-in-out infinite;
            transform-box: fill-box;
            transform-origin: center
        }
        
        @keyframes dpulse {
            0%,
            100% {
                opacity: 1
            }
            50% {
                opacity: .4
            }
        }
        
        .pdot.blink {
            animation: dblink .45s steps(2) infinite
        }
        
        @keyframes dblink {
            50% {
                opacity: .1
            }
        }
        /* edges */
        
        .edge {
            pointer-events: none;
            transition: opacity .25s
        }
        
        .edge .base {
            fill: none;
            transition: stroke .2s
        }
        
        .edge.wire .base {
            stroke-dasharray: 5 6
        }
        
        #cv.focusing .edge:not(.hot) {
            opacity: .16
        }
        
        .comet {
            fill: none;
            stroke-linecap: round
        }
        
        .hd {
            transition: opacity .2s
        }
        /* floats */
        
        .float {
            filter: drop-shadow(0 3px 7px rgba(30, 50, 80, .16))
        }
        
        .fl {
            animation: fbob var(--d, 5s) ease-in-out infinite
        }
        
        @keyframes fbob {
            0%,
            100% {
                transform: translateY(0)
            }
            50% {
                transform: translateY(-4px)
            }
        }
        
        .flash {
            filter: drop-shadow(0 0 8px rgba(63, 131, 214, .9)) drop-shadow(0 3px 7px rgba(30, 50, 80, .16))
        }
        /* hands */
        
        .hand .an {
            animation: hbob var(--d, 3s) ease-in-out infinite
        }
        
        @keyframes hbob {
            0%,
            100% {
                transform: translateY(0)
            }
            50% {
                transform: translateY(-4px)
            }
        }
        
        .hand.tap .an {
            animation: htap .55s ease
        }
        
        @keyframes htap {
            35% {
                transform: translateY(4px) scale(.88)
            }
        }
        /* reveal groups */
        
        .deckb {
            opacity: 0;
            transform: translateY(-9px) scale(.92);
            transition: .5s cubic-bezier(.34, 1.5, .5, 1);
            transform-box: fill-box;
            transform-origin: center
        }
        
        .deckb.show {
            opacity: 1;
            transform: none
        }
        
        .popel {
            opacity: 0;
            transform: scale(.55);
            transition: .4s cubic-bezier(.34, 1.6, .5, 1);
            transform-box: fill-box;
            transform-origin: center
        }
        
        .popel.show {
            opacity: 1;
            transform: none
        }
        
        .popel.gone {
            opacity: 0;
            transform: scale(.9)
        }
        
        .val {
            opacity: 0;
            transition: opacity .45s
        }
        
        .val.show {
            opacity: 1
        }
        
        .popin {
            animation: ppin .55s cubic-bezier(.34, 1.8, .5, 1) both;
            transform-box: fill-box;
            transform-origin: center
        }
        
        @keyframes ppin {
            from {
                opacity: 0;
                transform: scale(.3)
            }
        }
        
        .gton {
            transition: fill .3s
        }
        /* tooltip */
        
        #tip {
            position: absolute;
            z-index: 9;
            pointer-events: none;
            background: #16283e;
            color: #fff;
            padding: 9px 12px;
            border-radius: 9px;
            max-width: 230px;
            box-shadow: 0 8px 22px rgba(10, 25, 45, .35);
            opacity: 0;
            transition: opacity .12s
        }
        
        #tip b {
            display: block;
            font-size: 12px;
            margin-bottom: 2px
        }
        
        #tip span {
            font-family: 'IBM Plex Mono', monospace;
            font-size: 10px;
            line-height: 1.5;
            color: #b9c8dc
        }
        
        @media (prefers-reduced-motion:reduce) {
            * {
                animation: none!important;
                transition: none!important
            }
        }
    </style>
</head>

<body>

    <div id="bar">
        <span class="kick">LLM-TRADING · DATASET AUDIT</span>
        <div class="pill" id="pill"><i></i><span id="stTxt">BOOTING…</span></div>
        <span class="hintbar">hover blocks · click to pulse links</span>
        <div class="spacer"></div>
        <div class="seg" id="seg"><button data-s="0.5">½×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button></div>
        <button class="btn primary" id="runBtn">RUN AUDIT</button>
        <button class="btn" id="resetBtn">RESET</button>
    </div>

    <div id="stage">
        <svg id="cv" viewBox="0 0 1410 772"></svg>
        <div id="tip"></div>
    </div>

    <script>
        /* ============ helpers ============ */
        const NS = 'http://www.w3.org/2000/svg',
            svg = document.getElementById('cv');
        const el = (t, a = {}, p) => {
            const n = document.createElementNS(NS, t);
            for (const k in a) n.setAttribute(k, a[k]);
            if (p) p.appendChild(n);
            return n;
        };
        const txt = (p, x, y, s, fs, fw, fill, anc = 'middle', ls = 0, cls = '') => {
            const t = el('text', {
                x,
                y,
                'font-size': fs,
                'font-weight': fw,
                fill,
                'text-anchor': anc,
                ...(ls ? {
                    'letter-spacing': ls
                } : {}),
                ...(cls ? {
                    class: cls
                } : {})
            }, p);
            t.textContent = s;
            return t;
        };
        const sleep = ms => new Promise(r => setTimeout(r, ms));
        const eo = p => 1 - Math.pow(1 - p, 3),
            eio = p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;

        function tween(dur, fn, ease) {
            return new Promise(res => {
                const t0 = performance.now();
                (function st(t) {
                    const p = Math.min(1, (t - t0) / dur);
                    fn(ease ? ease(p) : p);
                    p < 1 ? requestAnimationFrame(st) : res();
                })(t0);
            });
        }

        const C = {
            o: '#ef913b',
            oD: '#d97a1f',
            o1: '#fdeedd',
            o2: '#f2b880',
            g: '#3f9e5a',
            gD: '#358a4e',
            g1: '#ecf6ee',
            g2: '#a5d3af',
            b: '#3d7ec2',
            bD: '#2f6fc2',
            b1: '#f2f8fd',
            b2: '#a9cbe8',
            p: '#a24fc8',
            pD: '#963fb8',
            p1: '#f8eefb',
            p2: '#d9a8e8',
            ink: '#22384f',
            txt: '#3b4757',
            sub: '#7c8a9c',
            arr: '#3f83d6',
            wire: '#b9cfe6'
        };

        /* ============ icons (24×24) ============ */
        const ICONS = {
            prices: '<path d="M6 21v-5M11 21v-8M16 21v-6"/><path d="M4 8l6-5 4 3 6-5"/><path class="f" d="M16 1h4.2v4.2h-1.7V3.9L15 7.4 11 4.4 5.9 8.7 4.7 7.3 11 2l4 3 3.4-2.9h-2.4z"/>',
            news: '<rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M6.5 8.5h6M6.5 12h11M6.5 15.5h11"/><path d="M15.5 8.5h2"/>',
            robot: '<rect x="6" y="8" width="12" height="10" rx="2.5"/><path d="M12 8V5.4"/><circle class="f" cx="12" cy="4" r="1.4"/><circle class="f" cx="9.5" cy="12.3" r="1.15"/><circle class="f" cx="14.5" cy="12.3" r="1.15"/><path d="M9.5 15.6h5"/><path d="M6 12.5H3.6M20.4 12.5H18"/>',
            db: '<ellipse cx="12" cy="5.5" rx="7" ry="2.7"/><path d="M5 5.5v12c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7v-12"/><path d="M5 11.5c0 1.5 3.1 2.7 7 2.7s7-1.2 7-2.7"/>',
            sliders: '<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.1" fill="#fff"/><circle cx="15" cy="12" r="2.1" fill="#fff"/><circle cx="8" cy="17" r="2.1" fill="#fff"/>',
            gauge: '<path d="M4 16.5a8 8 0 1 1 16 0"/><path d="M12 16.5l4.2-4.6"/><circle class="f" cx="12" cy="16.5" r="1.6"/><path d="M7 20.5h10"/>',
            layers: '<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 12.5l9 5 9-5"/><path d="M3 16.5l9 5 9-5"/>',
            drift: '<circle class="f" cx="5" cy="16" r="1.35"/><circle class="f" cx="9" cy="11.6" r="1.35"/><circle class="f" cx="13" cy="13.4" r="1.35"/><circle class="f" cx="17" cy="8" r="1.35"/><path d="M4 20.5L18.6 6.5"/><path d="M14.4 6H19v4.6"/>',
            bubble: '<path d="M4 5h16v11h-9.5L7 19.5V16H4z"/><path d="M12 8.2v3.6"/><circle class="f" cx="12" cy="14" r=".95"/>',
            headcheck: '<path d="M9.5 20.5v-3c-2.5-.8-4-3-4-5.7C5.5 8 8.4 5.5 12 5.5s6.5 2.6 6.5 6.3c0 2.7-1.5 4.9-4 5.7v3"/><path d="M9.8 12l1.7 1.7 3-3.4"/>',
            tri: '<path d="M12 3.5L21.5 20h-19z"/><path d="M12 9.5v4.6"/><circle class="f" cx="12" cy="16.8" r=".95"/>',
            backtest: '<path d="M4 4v16h16"/><path d="M7 15l3.5-4 3 2.5L18 8.5"/><path d="M14.6 8.5H18V12"/>',
            pie: '<path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M14.5 2.8A9 9 0 0 1 21.2 9.5H14.5z"/>',
            bars: '<path d="M4 20h16"/><path d="M7 20v-6M12 20v-10M17 20v-14"/>',
        };

        /* ============ canvas + defs ============ */
        const defs = el('defs', {}, svg);
        const mkArr = (id, c) => {
            const m = el('marker', {
                id,
                viewBox: '0 0 10 10',
                refX: 8,
                refY: 5,
                markerWidth: 11,
                markerHeight: 11,
                orient: 'auto-start-reverse',
                markerUnits: 'userSpaceOnUse'
            }, defs);
            el('path', {
                d: 'M0 0L10 5L0 10Z',
                fill: c
            }, m);
        };
        mkArr('arr', C.arr);
        mkArr('arrH', '#5ea0e0');
        const gb = el('linearGradient', {
            id: 'gb',
            x1: 0,
            y1: 0,
            x2: 1,
            y2: 0
        }, defs);
        el('stop', {
            offset: '0',
            'stop-color': '#6fb0ea'
        }, gb);
        el('stop', {
            offset: '1',
            'stop-color': '#2f6fc2'
        }, gb);

        el('rect', {
            x: 8,
            y: 6,
            width: 1394,
            height: 758,
            rx: 18,
            fill: '#f3f6fa',
            stroke: '#dce3eb',
            'stroke-width': 1.5
        }, svg);
        txt(svg, 705, 54, 'LLM Trading Dataset Auditing', 30, 800, '#14304a');

        /* ============ stage panels ============ */
        const PANELS = [{
            x: 55,
            y: 125,
            w: 222,
            h: 460,
            c: C.o,
            st: 'Stage 1',
            t: 'INPUTS'
        }, {
            x: 315,
            y: 125,
            w: 260,
            h: 460,
            c: C.g,
            st: 'Stage 2',
            t: 'DATA & FEATURE PIPELINE'
        }, {
            x: 635,
            y: 125,
            w: 425,
            h: 460,
            c: C.b,
            st: 'Stage 3',
            t: 'AUDITING ENGINE & AUDIT MODULES'
        }, {
            x: 1125,
            y: 125,
            w: 235,
            h: 460,
            c: C.p,
            st: 'Stage 4',
            t: 'EVALUATION & REPORTS'
        }];
        PANELS.forEach((P, i) => {
            const g = el('g', {}, svg),
                inn = el('g', {
                    class: 'in'
                }, g);
            inn.style.animationDelay = (.05 + i * .1) + 's';
            el('rect', {
                x: P.x,
                y: P.y,
                width: P.w,
                height: P.h,
                rx: 12,
                fill: '#fff',
                stroke: {
                    0: C.o2,
                    1: C.g2,
                    2: C.b2,
                    3: C.p2
                }[i],
                'stroke-width': 1.5
            }, inn);
            el('path', {
                d: `M ${P.x} ${P.y+36} V ${P.y+12} Q ${P.x} ${P.y} ${P.x+12} ${P.y} H ${P.x+P.w-12} Q ${P.x+P.w} ${P.y} ${P.x+P.w} ${P.y+12} V ${P.y+36} Z`,
                fill: P.c
            }, inn);
            txt(inn, P.x + P.w / 2, P.y - 16, P.st, 15, 700, P.c);
            txt(inn, P.x + P.w / 2, P.y + 23, P.t, 12.5, 700, '#fff', 'middle', 1.2);
        });

        /* ============ icon registry ============ */
        const DRAW = [];

        function mkIcon(name, color, cx, cy, s, parent, ph) {
            const g = el('g', {
                class: 'ic',
                style: `color:${color}`,
                transform: `translate(${cx-12*s},${cy-12*s}) scale(${s})`
            }, parent);
            g.innerHTML = ICONS[name];
            const shapes = [...g.querySelectorAll('path,circle,rect,ellipse')];
            const strokes = [],
                fills = [];
            shapes.forEach(p => {
                if (p.classList.contains('f')) {
                    p.style.opacity = 0;
                    fills.push(p);
                    return;
                }
                try {
                    const L = p.getTotalLength();
                    p.setAttribute('stroke-dasharray', L);
                    p.setAttribute('stroke-dashoffset', L);
                    strokes.push({
                        p,
                        L
                    });
                } catch (e) {}
            });
            DRAW.push({
                strokes,
                fills,
                ph
            });
            return g;
        }

        function drawItems(ph, dur = 520, stag = 90) {
            const items = DRAW.filter(o => o.ph === ph);
            return items.reduce((pr, it) => pr.then(() => tween(dur, p => it.strokes.forEach(s => s.p.setAttribute('stroke-dashoffset', String(s.L * (1 - p)))))).then(() => {
                it.fills.forEach(f => f.style.opacity = 1);
                return sleep(stag / speedMul);
            }), Promise.resolve());
        }

        function resetDraw() {
            DRAW.forEach(it => {
                it.strokes.forEach(s => s.p.setAttribute('stroke-dashoffset', s.L));
                it.fills.forEach(f => f.style.opacity = 0);
            });
        }

        /* ============ cards ============ */
        const gE = el('g', {}, svg),
            gN = el('g', {}, svg),
            gF = el('g', {}, svg),
            gTop = el('g', {
                'pointer-events': 'none'
            }, svg);
        const nodeMap = {},
            NODE_TIP = {};
        const TIPS = {
            prices: ['Market Prices & Macro Indicators', 'OHLCV candles plus macro series — rates, FX, commodities.'],
            news: ['Market News & Textual Data', 'Headlines and text sentiment for watched instruments.'],
            preds: ['Model Predictions', 'Signals from the LLM agent and baseline models (JSON).'],
            loader: ['Data Loader & Preprocessing', 'Cleans, aligns and timestamps every raw source.'],
            feature: ['Feature Engineering', 'Derives technical features: MAs, RSI, MACD, volatility.'],
            regime: ['Market Regime Detector', 'Classifies regime: trend / range / volatile.'],
            merged: ['Merged & Processed Dataset', 'Single model-ready dataset with aligned labels.'],
            drift: ['Drift Detector', 'PSI / KS tests for distribution shift in features.'],
            hallc: ['Hallucination & Consistency', 'Checks prediction coherence against known facts.'],
            theory: ['Theory Validator', 'Validates calls against financial-theory priors.'],
            risk: ['Risk Audit', 'Stress-tests exposure: drawdown, volatility, limits.'],
            trust: ['Dynamic Trust Score Generator', 'Blends every audit signal into one 0–100 score.'],
            gt: ['Ground Truth Generator', 'Builds realized outcomes used to score predictions.'],
            backtest: ['Financial Backtesting', 'Replays history: returns, Sharpe, max drawdown.'],
            portfolio: ['Portfolio Metrics', 'Allocation quality, diversification, PnL attribution.'],
            compare: ['Model Comparison', 'LLM vs baselines: LSTM, Transformer, XGBoost.'],
            summary: ['Summary', 'Final verdict: alerts, overall trust, go / no-go.']
        };

        function mkCard(d) {
            const g = el('g', {
                    class: 'node'
                }, gN),
                inn = el('g', {
                    class: 'in'
                }, g);
            inn.style.animationDelay = (d.dl || 0) + 's';
            el('rect', {
                class: 'cbox',
                x: d.x,
                y: d.y,
                width: d.w,
                height: d.h,
                rx: 11,
                fill: d.fill,
                stroke: d.stroke,
                'stroke-width': 1.4
            }, inn);
            const n = {
                id: d.id,
                x: d.x,
                y: d.y,
                w: d.w,
                h: d.h,
                cx: d.x + d.w / 2,
                cy: d.y + d.h / 2,
                el: g,
                in: inn,
                edges: []

        }

        function bez(a, fa, b, fb, oa, ob) {
            const [x1, y1] = anchor(a, fa, oa), [x2, y2] = anchor(b, fb, ob);
            const k = Math.min(92, Math.max(28, Math.hypot(x2 - x1, y2 - y1) * .45)),
                n1 = NORM[fa],
                n2 = NORM[fb];
            return `M ${x1} ${y1} C ${x1+n1[0]*k} ${y1+n1[1]*k}, ${x2+n2[0]*k} ${y2+n2[1]*k}, ${x2} ${y2}`;
        }
        const EDGES = [{
            id: 'e1',
            f: 'prices',
            t: 'loader',
            sf: 'r',
            tf: 'l',
            ob: -16
        }, {
            id: 'e2',
            f: 'news',
            t: 'loader',
            sf: 'r',
            tf: 'l'
        }, {
            id: 'e3',
            f: 'preds',
            t: 'loader',
            sf: 'r',
            tf: 'l',
            ob: 16
        }, {
            id: 'e4',
            f: 'loader',
            t: 'feature',
            sf: 'b',
            tf: 't'
        }, {
            id: 'e5',
            f: 'feature',
            t: 'regime',
            sf: 'b',
            tf: 't'
        }, {
            id: 'e6',
            f: 'regime',
            t: 'merged',
            sf: 'b',
            tf: 't'
        }, {
            id: 'e7',
            f: 'merged',
            t: 'drift',
            sf: 'r',
            tf: 'l',
            d: 'M 545 537 C 606 537 598 235 655 235'
        }, {
            id: 'e12',
            f: 'trust',
            t: 'backtest',
            sf: 'r',
            tf: 'l',
            main: 1,
            d: 'M 1045 475.5 H 1084 Q 1096 475.5 1096 463.5 V 247 Q 1096 235 1108 235 H 1143'
        }, {
            id: 'e13',
            f: 'trust',
            t: 'compare',
            sf: 'r',
            tf: 'l',
            main: 1,
            d: 'M 1045 475.5 H 1084 Q 1096 475.5 1096 487.5 V 490 Q 1096 502 1108 502 H 1143'
        }, {
            id: 'e8',
            f: 'drift',
            t: 'trust',
            sf: 'b',
            tf: 't',
            oa: -38,
            ob: -138,
            wire: 1
        }, {
            id: 'e9',
            f: 'hallc',
            t: 'trust',
            sf: 'b',
            tf: 't',
            oa: -2,
            ob: 98,
            wire: 1
        }, {
            id: 'e10',
            f: 'theory',
            t: 'trust',
            sf: 'b',
            tf: 't',
            oa: 10,
            ob: -90,
            wire: 1
        }, {
            id: 'e11',
            f: 'risk',
            t: 'trust',
            sf: 'b',
            tf: 't',
            oa: -38,
            ob: 62,
            wire: 1
        }, {
            id: 'e14',
            f: 'gt',
            t: 'trust',
            sf: 't',
            tf: 'b',
            d: 'M 850 540 L 850 523',
            wire: 1
        }, ];
        const allEdges = [],
            edgeMap = {};
        EDGES.forEach(d => {
            const a = nodeMap[d.f],
                b = nodeMap[d.t];
            const path = d.d || bez(a, d.sf, b, d.tf, d.oa || 0, d.ob || 0);
            const g = el('g', {
                class: 'edge ' + (d.wire ? 'wire' : 'main')
            }, gE);
            const base = el('path', {
                class: 'base',
                d: path,
                ...(d.wire ? {
                    stroke: C.wire,
                    'stroke-width': 1.8
                } : {
                    stroke: C.arr,
                    'stroke-width': 3.2,
                    'marker-end': 'url(#arr)'
                })
            }, g);
            const tone = d.wire ? {
                tr: '#cddcee',
                hd: '#a9c4e2',
                sp: 14,
                w: 1.6
            } : {
                tr: '#8fb8e8',
                hd: '#2f6fc2',
                sp: 55,
                w: 2.2
            };
            const comets = [],
                nn = d.wire ? 1 : (d.n || 2),
                L = base.getTotalLength(),
                cyc = L + 25;
            for (let i = 0; i < nn; i++) {
                const cp = el('path', {
                    class: 'comet',
                    d: path
                }, g);
                cp.setAttribute('stroke-dasharray', `9 ${L+16}`);
                cp.setAttribute('stroke-width', tone.w);
                cp.style.stroke = tone.tr;
                cp.style.strokeOpacity = d.wire ? .5 : .4;
                const hd = el('circle', {
                    class: 'hd',
                    r: d.wire ? 2 : 2.6
                }, g);
                hd.style.fill = tone.hd;
                comets.push({
                    p: cp,
                    h: hd,
                    o: 9 - i * (cyc / nn) - Math.random() * cyc * .5,
                    a: Math.random()
                });
            }
            const e = {
                id: d.id,
                g,
                base,
                comets,
                L,
                speed: tone.sp + Math.random() * 8 - 4,
                rate: 1,
                rateT: 1,
                hotv: false
            };
            allEdges.push(e);
            edgeMap[d.id] = e;
            (a.edges).push(e);
            (b.edges).push(e);
            g.style.animation = `popin .6s ${.5+allEdges.length*.04}s both`;
            g.addEventListener('animationend', () => g.style.animation = '');
        });

        function hot(e, on) {
            e.hotv = on;
            e.g.classList.toggle('hot', on);
            e.rateT = on ? 2.8 : 1;
            if (!e.g.classList.contains('wire')) e.base.setAttribute('marker-end', `url(#arr${on?'H':''})`);
        }
        const surge = (ids, on) => ids.forEach(id => hot(edgeMap[id], on));
        const act = (ids, on) => ids.forEach(id => nodeMap[id].el.classList.toggle('act', on));

        function flash(gs, on) {
            gs.forEach(g => g.classList.toggle('flash', on));
        }

        /* ============ chart dots ============ */
        const FLOWS = [...cumLines.map((c, i) => ({
            p: c.p,
            L: c.L,
            o: Math.random() * c.L,
            sp: 16 + i * 3,
            col: ['#2fa866', '#9b59d0', '#3f83d6', '#ef913b'][i],
            on: false,
            g: cumG
        })), {
            p: riskLine,
            L: riskD.L,
            o: 0,
            sp: 14,
            col: '#e05252',
            on: false,
            g: riskG
        }];
        FLOWS.forEach(f => {
            f.hd = el('circle', {
                r: 2.2,
                fill: f.col,
                opacity: 0
            }, f.g);
        });

        /* ============ main frame loop ============ */
        let speedMul = 1,
            runDone = false,
            lastT = performance.now();

        function frame(t) {
            const dt = Math.min(.05, (t - lastT) / 1000);
            lastT = t;
            for (const e of allEdges) {
                e.rate += (e.rateT - e.rate) * Math.min(1, dt * 5);
                const v = e.speed * speedMul * e.rate;
                for (const c of e.comets) {
                    c.o -= v * dt;
                    if (c.o < -(e.L + 16)) c.o += e.L + 25;
                    c.a = Math.min(1, c.a + dt * .8);
                    c.p.setAttribute('stroke-dashoffset', c.o.toFixed(2));
                    c.p.style.opacity = c.a;
                    const lead = 9 - c.o;
                    if (lead > 2 && lead < e.L - 2) {
                        const pt = e.base.getPointAtLength(lead);
                        c.h.style.opacity = c.a;
                        c.h.setAttribute('cx', pt.x);
                        c.h.setAttribute('cy', pt.y);
                    } else c.h.style.opacity = 0;
                }
            }
            for (const f of FLOWS) {
                if (!f.on) continue;
                f.o -= f.sp * speedMul * dt;
                if (f.o < -(f.L + 10)) f.o += f.L + 20;
                const lead = -f.o;
                if (lead > 2 && lead < f.L - 2) {
                    const pt = f.p.getPointAtLength(lead);
                    f.hd.setAttribute('opacity', .9);
                    f.hd.setAttribute('cx', pt.x);
                    f.hd.setAttribute('cy', pt.y);
                } else f.hd.setAttribute('opacity', 0);
            }
            if (runDone) nodeMap.trust.nd.setAttribute('transform', `rotate(${-90+180*.852+Math.sin(t/650)*1.5} 965 494)`);
            requestAnimationFrame(frame);
        }
        requestAnimationFrame(frame);

        /* ============ tooltip ============ */
        const tip = document.getElementById('tip'),
            stageEl = document.getElementById('stage');

        function showTip(name, desc, e) {
            tip.innerHTML = `<b>${name}</b><span>${desc}</span>`;
            tip.style.opacity = 1;
            moveTip(e);
        }

        function moveTip(e) {
            const r = stageEl.getBoundingClientRect();
            tip.style.left = Math.min(e.clientX - r.left + 16, r.width - 240) + 'px';
            tip.style.top = (e.clientY - r.top + 18) + 'px';
        }

        function hideTip() {
            tip.style.opacity = 0;
        }

        /* ============ status + run ============ */
        const pill = document.getElementById('pill'),
            stTxt = document.getElementById('stTxt');
        const setSt = (t, m) => {
            stTxt.textContent = t;
            pill.className = 'pill' + (m ? ' ' + m : '');
        };
        const runBtn = document.getElementById('runBtn'),
            resetBtn = document.getElementById('resetBtn');
        let running = false,
            token = 0;
        const W = ms => sleep(ms / speedMul);

        function softReset() {
            runDone = false;
            resetDraw();
            const T = nodeMap.trust,
                gt = nodeMap.gt,
                S = nodeMap.summary;
            T.scoreV.textContent = '0.0';
            T.scoreV.setAttribute('fill', '#9aa7b5');
            T.ga.setAttribute('stroke-dashoffset', T.gl);
            T.nd.setAttribute('transform', 'rotate(-90 965 494)');
            gt.box.setAttribute('fill', '#fff');
            gt.ck.setAttribute('stroke-dashoffset', gt.cl);
            S.sysV.classList.remove('show');
            S.alrV.classList.remove('show');
            S.trV.classList.remove('show');
            S.goV.style.opacity = 0;
            S.goV.classList.remove('popin');
            techG.classList.remove('show');
            badge.classList.remove('show', 'gone');
            nodeMap.merged.b.forEach(b => b.classList.remove('show'));
            FLOWS.forEach(f => {
                f.on = false;
                f.hd.setAttribute('opacity', 0);
            });
            allEdges.forEach(e => {
                e.hotv = false;
                e.g.classList.remove('hot');
                e.rateT = 1;
            });
            Object.values(nodeMap).forEach(n => n.el.classList.remove('act'));
        }

        async function run() {
            if (running) return;
            running = true;
            const tk = ++token;
            runBtn.disabled = true;
            runBtn.textContent = 'RUNNING…';
            softReset();
            const ck = () => {
                if (tk !== token) throw 0;
            };
            const Tn = nodeMap.trust,
                gt = nodeMap.gt,
                S = nodeMap.summary;
            try {
                /* 1 · inputs */
                setSt('PHASE 1 · INGESTING INPUTS', 'run');
                surge(['e1', 'e2', 'e3'], true);
                act(['prices', 'news', 'preds'], true);
                tap(0);
                flash([csvG, jsonG], true);
                await drawItems(1);
                ck();
                await W(1300);
                ck();
                flash([csvG, jsonG], false);
                act(['prices', 'news', 'preds'], false);
                surge(['e1', 'e2', 'e3'], false);

                /* 2 · pipeline */
                setSt('PHASE 2 · DATA & FEATURE PIPELINE', 'run');
                surge(['e4', 'e5', 'e6'], true);
                act(['loader'], true);
                await drawItems(2);
                ck();
                await W(450);
                ck();
                act(['loader'], false);
                act(['feature'], true);
                techG.classList.add('show');
                tap(3);
                await W(650);
                ck();
                act(['feature'], false);
                act(['regime'], true);
                await W(500);
                ck();
                act(['regime'], false);
                surge(['e7'], true);
                await W(450);
                ck();
                nodeMap.merged.b.forEach(b => b.classList.add('show'));
                await W(450);
                ck();
                surge(['e4', 'e5', 'e6', 'e7'], false);

                /* 3 · audit engine */
                setSt('PHASE 3 · RUNNING AUDIT MODULES', 'run');
                surge(['e8', 'e9', 'e10', 'e11', 'e14'], true);
                await drawItems(3);
                ck();
                const dotOf = {
                    drift: null,
                    hallc: null,
                    theory: null,
                    risk: null
                };
                for (const [id, extra] of[['drift', 1], ['hallc', 0], ['theory', 0], ['risk', 0]]) {
                    act([id], true);
                    const d = nodeMap[id].in.querySelector('.pdot');
                    d.classList.add('blink');
                    if (id === 'risk') tween(700 / speedMul, p => {
                        riskD.p.setAttribute('stroke-dashoffset', riskD.L * (1 - p));
                    }).then(() => {
                        riskD.f.style.opacity = 1;
                        FLOWS[4].on = true;
                    });
                    await W(680);
                    ck();
                    act([id], false);
                    d.classList.remove('blink');
                    if (extra) {
                        badge.classList.add('show');
                        await W(1000);
                        ck();
                        badge.classList.add('gone');
                    }
                }
                setSt('TRUST SCORE COMPUTATION', 'run');
                act(['trust'], true);
                Tn.scoreV.setAttribute('fill', C.ink);
                await Promise.all([
                    tween(1500 / speedMul, p => {
                        Tn.scoreV.textContent = (85.2 * eo(p)).toFixed(1);
                        Tn.ga.setAttribute('stroke-dashoffset', Tn.gl * (1 - eo(p)));
                    }, eo),
                    tween(1500 / speedMul, p => Tn.nd.setAttribute('transform', `rotate(${-90+180*eio(p)} 965 494)`), eio)
                ]);
                ck();
                gt.box.setAttribute('fill', C.b);
                tween(350 / speedMul, p => gt.ck.setAttribute('stroke-dashoffset', gt.cl * (1 - p)));
                await W(350);
                ck();
                act(['trust'], false);
                surge(['e8', 'e9', 'e10', 'e11', 'e14'], false);

                /* 4 · evaluation */
                setSt('PHASE 4 · EVALUATION & REPORTS', 'run');
                surge(['e12', 'e13'], true);
                act(['backtest'], true);
                await drawItems(4);
                ck();
                await W(400);
                ck();
                act(['backtest'], false);
                act(['portfolio'], true);
                await W(450);
                ck();
                act(['portfolio'], false);
                act(['compare'], true);
                for (let i = 0; i < cumLines.length; i++) {
                    tween(900 / speedMul, p => cumLines[i].p.setAttribute('stroke-dashoffset', cumLines[i].L * (1 - p)), eo);
                    await W(160);
                    ck();
                }
                await W(500);
                ck();
                cumLines.forEach((c, i) => FLOWS[i].on = true);
                act(['compare'], false);
                surge(['e12', 'e13'], false);

                /* 5 · summary */
                setSt('PHASE 5 · FINAL SUMMARY', 'run');
                tap(4);
                S.sysV.classList.add('show');
                await W(280);
                ck();
                S.alrV.classList.add('show');
                await W(380);
                ck();
                S.trV.classList.add('show');
                await tween(800 / speedMul, p => S.trV.textContent = (85.2 * eo(p)).toFixed(1), eo);
                ck();
                S.goV.style.opacity = 1;
                S.goV.classList.add('popin');
                runDone = true;
                setSt('AUDIT COMPLETE · TRUST 85.2 ( GO )', 'done');
                await W(700);
                ck();
            } catch (err) {
                if (err !== 0) console.error(err);
            }
            running = false;
            if (tk === token) {
                runBtn.disabled = false;
                runBtn.textContent = 'REPLAY AUDIT';
            }
        }

        resetBtn.addEventListener('click', () => {
            token++;
            running = false;
            softReset();
            runBtn.disabled = false;
            runBtn.textContent = 'RUN AUDIT';
            setSt('RESET — IDLE', '');
        });
        runBtn.addEventListener('click', run);
        document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
            document.querySelectorAll('#seg button').forEach(x => x.classList.remove('on'));
            b.classList.add('on');
            speedMul = parseFloat(b.dataset.s);
        }));

        /* boot — auto play once so the diagram introduces itself */
        setSt('IDLE — AUTO-RUN QUEUED', '');
        setTimeout(run, 900);
    </script>
</body>

</html>
